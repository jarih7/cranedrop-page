<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4edda">
  <title>Privacy — CraneDrop</title>
  <style>
    :root { --paper:#f4edda; --ink:#263b32; --muted:#64746a; --green:#315343; --orange:#e7834e; --card:#fffaf0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background-color:var(--paper); background-image:radial-gradient(#d7ceb8 .8px, transparent .8px); background-size:16px 16px; font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(100% - 36px, 650px); margin:0 auto; padding:70px 0 32px; }
    .eyebrow { color:var(--green); font-size:.76rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:12px 0 26px; font-size:clamp(2.5rem,8vw,4rem); line-height:1; letter-spacing:-.06em; }
    .card { padding:clamp(22px,5vw,38px); background:var(--card); border:3px solid var(--ink); box-shadow:6px 6px 0 #263b3220; }
    h2 { color:var(--green); font-size:.9rem; letter-spacing:.12em; text-transform:uppercase; }
    p { color:var(--muted); font-size:1rem; line-height:1.75; }
    a { color:#a74d2b; font-weight:700; text-underline-offset:3px; }
    .back { display:inline-block; margin-top:28px; color:var(--green); }
    footer { margin-top:48px; color:var(--muted); text-align:center; font-size:.8rem; }
    a:focus-visible { outline:3px solid var(--orange); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CraneDrop · iOS</p>
    <h1>Privacy</h1>
    <section class="card">
      <h2>Privacy information</h2>
      <p>CraneDrop is currently in development. Privacy details for the game will be published here before its release.</p>
      <p>For questions, please <a href="https://github.com/jarih7/cranedrop-page/issues">contact us through GitHub</a>.</p>
    </section>
    <a class="back" href="index.html">← Back to CraneDrop</a>
    <footer>&copy; <span id="year"></span> CraneDrop. All rights reserved.</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
