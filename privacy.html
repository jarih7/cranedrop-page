<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2544">
  <meta name="description" content="Privacy information for CraneDrop, a pixel-art city-building game for iOS.">
  <title>Privacy — CraneDrop</title>
  <style>
    :root { color-scheme: dark; --night:#11182c; --navy:#1b2544; --panel:#202d50; --line:#91a8d1; --gold:#ffd34e; --sky:#bfd2f4; --muted:#91a4cc; --ink:#10172b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--sky); background:var(--navy); background-image:radial-gradient(#a8b8d31b 1px,transparent 1px); background-size:24px 24px; font-family:"Courier New",ui-monospace,monospace; -webkit-font-smoothing:none; }
    main { width:min(100% - 32px,720px); margin:0 auto; padding:clamp(38px,9vw,76px) 0 32px; }
    .eyebrow { color:var(--gold); font-size:.76rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:14px 0 28px; color:var(--gold); font-size:clamp(2.8rem,9vw,5rem); line-height:1; text-shadow:5px 5px 0 var(--ink); }
    .card { padding:clamp(22px,5vw,38px); background:var(--panel); border:4px solid var(--line); box-shadow:8px 8px 0 var(--ink); }
    h2 { color:var(--gold); font-size:.9rem; letter-spacing:.1em; text-transform:uppercase; }
    p { color:var(--sky); font-size:1rem; line-height:1.8; }
    a { color:var(--gold); font-weight:800; text-underline-offset:4px; overflow-wrap:anywhere; }
    .back { display:inline-block; margin-top:30px; }
    footer { margin-top:46px; color:var(--muted); text-align:center; font-size:.8rem; }
    a:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CraneDrop · iOS</p>
    <h1>Privacy</h1>
    <section class="card">
      <h2>Privacy information</h2>
      <p>CraneDrop is currently in development. Privacy details for the game will be published here before its release.</p>
      <p>For questions, email <a href="mailto:cranedropgame@gmail.com">cranedropgame@gmail.com</a>.</p>
    </section>
    <a class="back" href="index.html">← Back to CraneDrop</a>
    <footer>&copy; <span id="year"></span> CraneDrop. All rights reserved.</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
